<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobPortal — Контакти</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="logo" href="../index.html">JOB<span>PORTAL</span></a>
            <nav class="nav" aria-label="Головне меню">
                <ul class="nav__list">
                    <li><a class="nav__link" href="../index.html">Головна</a></li>
                    <li><a class="nav__link" href="catalog.html">Вакансії</a></li>
                    <li><a class="nav__link" href="companies.html">Компанії</a></li>
                    <li><a class="nav__link nav__link--active" href="contact.html">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="section contact-section">
            <h1>Зворотний зв’язок</h1>
            <p>Маєте запитання чи пропозиції? Напишіть нам!</p>
            <form class="contact-form">
                <label>Ваше ім'я: <input type="text" required></label>
                <label>Email: <input type="email" required></label>
                <label>Повідомлення: <textarea rows="5" required></textarea></label>
                <button type="submit" class="btn">Надіслати</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <p>&copy; 2026 JobPortal</p>
        </div>
    </footer>
</body>
</html>
